<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mural de recados</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cinzel:wght@400;600&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/logo.jpg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="nav"></div>
  <main class="secao" id="conteudo">
    <h1 id="titulo" class="titulo-pagina"></h1>
    <p id="texto" class="texto-centro"></p>
    <form id="formRecado" class="form">
      <input id="recNome" placeholder="Seu nome" maxlength="80" required>
      <textarea id="recMsg" placeholder="Sua mensagem" maxlength="500" rows="4" required></textarea>
      <input id="recSite" class="isca" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit">Enviar recado</button>
      <p id="recStatus" class="status" role="status"></p>
    </form>
    <div class="mural" id="listaRecados"></div>
    <p id="vazio" class="texto-centro" hidden></p>
  </main>

  <footer id="rodape"></footer>
  <script type="module" src="js/pages/mural.js"></script>
</body>
</html>
